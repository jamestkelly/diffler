name: Review

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check Quiz Schema
        run: |
          pnpm schema:write
          pnpm exec biome format --write schemas/quiz-document.schema.json
          git diff --exit-code -- schemas/quiz-document.schema.json

      - name: Build CLI
        run: pnpm build

      - name: Smoke Test CLI
        run: node dist/cli.js --help

      - name: Validate Example Quiz
        run: node dist/cli.js validate examples/quiz.json

      - name: Pack npm Artifact
        run: pnpm pack --pack-destination "${RUNNER_TEMP}"

  review-gate:
    name: Review Gate
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check Prerequisite Results
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [[ "${VALIDATE_RESULT}" != "success" ]]; then
            echo "Validate finished with result: ${VALIDATE_RESULT}" >&2
            exit 1
          fi
